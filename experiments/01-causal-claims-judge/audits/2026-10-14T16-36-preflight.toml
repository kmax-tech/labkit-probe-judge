grade = "WARNING"
text = "WARNING · experiments/01-causal-claims-judge/PROTOCOL-causal-claims-judge.md:68 · The resolution check only tests synthetic extremes (12/12 and 6/12). It never computes how often C1 passes for a model with no recognition at all. A2 also admits a null lane anywhere in 4..8 of 12, and the C1 bar moves with it (null + 0.25: from 7/12 up to 11/12). · `c1_pass` = True for a coin-flipping registered lane. At null = 6/12 the bar is 9/12, so a random lane passes with P(≥9 of 12 | p=0.5) = 299/4096 ≈ 0.07. At an admissible null of 4/12 (two \"No\" answers to the English question on causal items) the bar drops to 7/12, so it passes with P(≥7 of 12) = 1586/4096 ≈ 0.39, against the registered expectation of \"at least 9 of 12\". · Gate without anchor/resolution (LAB-015 Preflight audit before freezing) · Add the chance rate of C1 passing across the A2 band (4, 6, 8 of 12) to the resolution check, and decide the criterion with that number in view before the freeze."
status = "accepted"
reason = "Chance pass rates, computed: a coin-flipping registered lane passes C1 with P=0.07 when the null lane is 6/12 and P=0.39 when it is 4/12 (inside the registered band of 2). Kept as a limit to state with the result; the band is registered, not tuned."

